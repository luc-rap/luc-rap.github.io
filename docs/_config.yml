title: Hello, I am Lucia (she/her) EN • SK Data enginner based in FL
markdown: kramdown

# for atom feed
author:
  name: Lucia Rapanova Woollett
  email: lucia.rapanova@gmail.com

plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections_dir: all_collections
collections:
  posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/
exclude: ["sitemap.xml", "feed.xml", "LICENSE", "README.md"]
