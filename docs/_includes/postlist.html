<div class="post-list">
  {% for post in site.posts %}
    <div class="post-item">
      {% if post.banner %}
      <div class="article-banner">
        <img src="{{ post.banner }}" alt="" />
      </div>
      {% endif %}
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      <p class="post-date">{{ post.date | date: "%B %d, %Y" }}</p>
      <p>{{ post.excerpt }}</p>
    </div>
  {% endfor %}
</div>
